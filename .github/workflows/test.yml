name: Test Agent Skill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Run offline skill tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -S -m unittest discover -s agent-skill/integrated-video-downloader/tests -p 'test_*.py' -v
